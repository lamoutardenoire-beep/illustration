<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit & Démo CRO - Avant/Après</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .spotlight { position: relative; }
        .spotlight::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 12px;
            padding: 2px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .hotspot-pulse {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-red 2s infinite;
        }
        .hotspot-pulse-green {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Top Header Bar -->
    <header class="max-w-6xl w-full mx-auto mb-6 flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-800/80 backdrop-blur border border-slate-700/60 p-4 rounded-xl shadow-lg">
        <div>
            <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <h1 class="text-lg font-bold text-white tracking-wide">Audit de Conversion & Friction Ergonomique</h1>
            </div>
            <p class="text-xs text-slate-400 mt-1">Cas réel issu d'un accompagnement client (données et contexte strictement anonymisés).</p>
        </div>

        <div class="flex items-center gap-3 bg-slate-900/80 p-1.5 rounded-lg border border-slate-700">
            <!-- Mode Switcher -->
            <button id="btn-before" onclick="setMode('before')" class="px-4 py-2 text-xs font-semibold rounded-md transition-all duration-200 flex items-center gap-1.5 bg-red-500/20 text-red-400 border border-red-500/30">
                <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                AVANT (Version Frictional)
            </button>
            <button id="btn-after" onclick="setMode('after')" class="px-4 py-2 text-xs font-semibold rounded-md transition-all duration-200 flex items-center gap-1.5 text-slate-400 hover:text-white">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                APRÈS (Version Optimisée)
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Interactive Preview Screen (Column 1-8) -->
        <div class="lg:col-span-8 bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative">
            
            <!-- Fake Browser Frame Bar -->
            <div class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                </div>
                <div class="bg-slate-950 border border-slate-800 rounded-md px-3 py-1 text-xs text-slate-400 flex items-center gap-2 w-1/2 justify-center font-mono">
                    <i data-lucide="lock" class="w-3 h-3 text-slate-500"></i>
                    https://mon-offre-b2b.com/demo
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleAnnotations()" id="btn-toggle-ann" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded border border-slate-700 flex items-center gap-1 transition">
                        <i data-lucide="eye" class="w-3 h-3"></i>
                        <span id="ann-status-text">Masquer Annotations</span>
                    </button>
                </div>
            </div>

            <!-- Hero Section Displayed -->
            <div class="p-8 md:p-12 min-h-[460px] flex flex-col justify-between relative bg-gradient-to-b from-slate-900/50 to-slate-950">
                
                <!-- Dynamic Content Area -->
                <div class="space-y-6">
                    
                    <!-- Tagline / Badge -->
                    <div id="hero-badge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium border bg-slate-800/80 text-slate-300 border-slate-700">
                        <span id="hero-badge-text">Logiciel All-in-One</span>
                    </div>

                    <!-- Main Headline -->
                    <div class="relative group">
                        <h2 id="hero-title" class="text-2xl md:text-4xl font-extrabold text-white leading-tight">
                            Boostez votre productivité d'entreprise
                        </h2>

                        <!-- Hotspot #1 (Title) -->
                        <button onclick="selectHotspot(1)" class="hotspot-btn absolute -right-2 -top-2 w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs text-white z-20 cursor-pointer transition transform hover:scale-110 hotspot-pulse bg-red-50
